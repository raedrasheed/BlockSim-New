name: Stage 2B PoCol tests

# Machine-generated evidence for S2B-8: runs the Stage-2B target-coupled / causal-search
# PoCol test suite (TV325-TV338, E2E-1..E2E-5, SCI-1..SCI-10, S2B-1 target tests, adapter)
# and uploads the pytest log + JUnit XML.

on:
  push:
    branches:
      - "thesis-v45-pocol-stage2b-target-causal-search-genesis-rollback-lock"
  pull_request:
    paths:
      - "Models/PoCol/stage2/**"
      - "tests/thesis_revision_v45/stage2/**"
      - ".github/workflows/stage2b-pocol-tests.yml"
  workflow_dispatch: {}

jobs:
  stage2b-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run Stage 2B PoCol test suite
        run: |
          python -m pytest tests/thesis_revision_v45/stage2/ -v --durations=0 \
            -p no:cacheprovider \
            --junitxml=stage2b_ci.junit.xml | tee stage2b_ci.log

      - name: Run standalone demo (smoke)
        run: python -m Models.PoCol.stage2.demo

      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2b-pytest-evidence
          path: |
            stage2b_ci.log
            stage2b_ci.junit.xml
