name: Stage 3A PoCol tests

# S3A evidence: runs the COMPLETE Stage-2B + Stage-3 + Stage-3A PoCol test suite (TV325-TV338,
# E2E-1..E2E-5, SCI-1..SCI-10, target tests, adapter, S3-01..S3-18, and S3A-01..S3A-12) on the
# Stage-3A correction branch, and uploads the pytest log + JUnit XML.

on:
  push:
    branches:
      - "thesis-v45-pocol-stage3a-security-floor-observation-activation-transaction-exhaustion-lock"
  pull_request:
    paths:
      - "Models/PoCol/stage2/**"
      - "tests/thesis_revision_v45/stage2/**"
      - ".github/workflows/stage3a-pocol-tests.yml"
  workflow_dispatch: {}

jobs:
  stage3a-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run complete Stage-2B + Stage-3 + Stage-3A test suite
        run: |
          python -m pytest tests/thesis_revision_v45/stage2/ -v --durations=0 \
            -p no:cacheprovider \
            --junitxml=stage3a_ci.junit.xml | tee stage3a_ci.log

      - name: Run standalone demo (smoke)
        run: python -m Models.PoCol.stage2.demo

      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3a-pytest-evidence
          path: |
            stage3a_ci.log
            stage3a_ci.junit.xml
