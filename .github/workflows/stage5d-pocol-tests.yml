name: Stage 5D PoCol tests

# S5D evidence: runs the COMPLETE Stage-2B .. Stage-5D PoCol test suite (195 tests: the 185
# accepted Stage-5C tests retained plus 10 new post-round evidence-integrity tests) on the
# Stage-5D branch, regenerates the Stage-5D metrics from real executions, and gates on the three
# post-round integrity metrics being zero in EVERY evidence scenario.
#
# Stage 5D modifies NO executable model code.  It corrects an invalid evidence metric
# (post_round_evaluation_count = len(evaluation_ledger)) and replaces it with a causal
# computation over the immutable evaluation ledger and round_terminal_times.

on:
  push:
    branches:
      - "thesis-v45-pocol-stage5d-post-round-evidence-integrity-lock"
  pull_request:
    paths:
      - "Models/PoCol/stage2/**"
      - "tests/thesis_revision_v45/stage2/**"
      - ".github/workflows/stage5d-pocol-tests.yml"
  workflow_dispatch: {}

concurrency:
  group: stage5d-pocol-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage5d-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run complete Stage-2B .. Stage-5D test suite
        run: |
          python -m pytest tests/thesis_revision_v45/stage2/ -v --durations=0 \
            -p no:cacheprovider \
            --junitxml=stage5d_ci.junit.xml | tee stage5d_ci.log

      - name: Verify the accepted Stage-2B search core is unmodified
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          EXPECTED = "17367b4c15eaabd664a496412bc3d1685bfcd9cf8749f71aea01aef70b094140"
          digest = hashlib.sha256(
              pathlib.Path("Models/PoCol/stage2/search.py").read_bytes()).hexdigest()
          print("search.py sha256:", digest)
          if digest != EXPECTED:
              sys.exit(f"search.py changed: expected {EXPECTED}, got {digest}")
          print("OK: the accepted Stage-2B search core is byte-identical to the frozen baseline")
          PY

      - name: Verify the accepted Stage-5C executable code is byte-identical
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          # Stage 5D is an EVIDENCE correction only.  Every accepted Stage-5C executable module
          # must be unchanged; a diff here means the correction overstepped its scope.
          EXPECTED = {
              "Models/PoCol/stage2/adapter.py":
                  "888639e802a02406553fec1a86a2f0bf283629bad2d7f32548d1505f8db7e5a8",
              "Models/PoCol/stage2/adversarial.py":
                  "d7b63b8fe3b331344b899e52bfe893bd9726423d8e58b9125841aca83529c4c6",
              "Models/PoCol/stage2/adversarial_runtime.py":
                  "1274bbd3c6b49152b7bd0ac75934227a43a685890c3b4c5a214a3a16b46e6819",
              "Models/PoCol/stage2/context.py":
                  "9c3b9c10f29165c40f3fe0978e50c1a5f9e11f36bbf2249248df65ba50088e33",
              "Models/PoCol/stage2/leases.py":
                  "2dfffde8d9ead0666b9e375e27c3b24ef83ff77175256af2473c123182768aea",
              "Models/PoCol/stage2/security.py":
                  "0a8f5c5df194ba2b8935bb933041c71985cd3090fe840f48f85bba952c2daea6",
              "Models/PoCol/stage2/simulator.py":
                  "93160001b5ce5f4a7cabc5647b899447482601bf5486eee22851ed5c36e9bf9a",
          }
          bad = []
          for path, expected in sorted(EXPECTED.items()):
              digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              print(f"{digest}  {path}")
              if digest != expected:
                  bad.append(f"{path}: expected {expected}, got {digest}")
          if bad:
              sys.exit("accepted Stage-5C executable code changed:\n  " + "\n  ".join(bad))
          print("OK: every accepted Stage-5C executable module is byte-identical")
          PY

      - name: Regenerate Stage-5D metrics from real executions
        run: python docs/thesis_revision_v45/stage_05d/generate_stage5d_metrics.py

      - name: Gate on post-round evidence integrity in EVERY scenario
        run: |
          python - <<'PY'
          import json, pathlib, sys
          d = json.loads(pathlib.Path(
              "docs/thesis_revision_v45/stage_05d/STAGE_05D_METRICS.json").read_text())
          scenarios = d["scenarios"]
          assert scenarios, "no evidence scenarios were produced"
          failures = []
          for name, v in sorted(scenarios.items()):
              for key in ("post_round_evaluation_record_count",
                          "post_round_evaluation_nonce_count",
                          "evaluation_missing_terminal_time_count"):
                  if v[key] != 0:
                      failures.append(f"{name}.{key} = {v[key]}")
              if v["offending_records"]:
                  failures.append(f"{name}: {len(v['offending_records'])} offending record(s)")
              if v["evaluation_ledger_entries"] <= 0:
                  failures.append(f"{name}: empty ledger — a zero result would be vacuous")
          if failures:
              sys.exit("post-round evidence integrity FAILED:\n  " + "\n  ".join(failures))
          inv = d["invariants"]
          for key, value in sorted(inv.items()):
              assert value, f"{key} is false"
          print(f"OK: post-round evidence integrity holds in all {len(scenarios)} scenarios")
          PY

      - name: Run standalone demo (smoke)
        run: python -m Models.PoCol.stage2.demo

      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5d-pytest-evidence
          path: |
            stage5d_ci.log
            stage5d_ci.junit.xml
            docs/thesis_revision_v45/stage_05d/STAGE_05D_METRICS.json
