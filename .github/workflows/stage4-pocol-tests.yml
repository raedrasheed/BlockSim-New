name: Stage 4 PoCol tests

# S4 evidence: runs the COMPLETE Stage-2B + Stage-3 + Stage-3A + Stage-4 PoCol test suite
# (TV325-TV338, E2E-1..E2E-5, SCI-1..SCI-10, target tests, adapter, S3-01..S3-18,
# S3A-01..S3A-12, and S4-01..S4-20) on the Stage-4 branch, and uploads the pytest log + JUnit
# XML.

on:
  push:
    branches:
      - "thesis-v45-pocol-stage4-range-leases-reassignment"
  pull_request:
    paths:
      - "Models/PoCol/stage2/**"
      - "tests/thesis_revision_v45/stage2/**"
      - ".github/workflows/stage4-pocol-tests.yml"
  workflow_dispatch: {}

jobs:
  stage4-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run complete Stage-2B + Stage-3 + Stage-3A + Stage-4 test suite
        run: |
          python -m pytest tests/thesis_revision_v45/stage2/ -v --durations=0 \
            -p no:cacheprovider \
            --junitxml=stage4_ci.junit.xml | tee stage4_ci.log

      - name: Run standalone demo (smoke)
        run: python -m Models.PoCol.stage2.demo

      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-pytest-evidence
          path: |
            stage4_ci.log
            stage4_ci.junit.xml
