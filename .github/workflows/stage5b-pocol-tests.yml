name: Stage 5B PoCol tests

# S5B evidence: runs the COMPLETE Stage-2B + Stage-3 + Stage-3A + Stage-4 + Stage-4A + Stage-4B +
# Stage-4C + Stage-5 + Stage-5A + Stage-5B PoCol test suite (TV325-TV338, E2E-1..5, SCI-1..10,
# target/adapter, S3-01..S3-18, S3A-01..S3A-12, S4-01..S4-20, S4A-01..S4A-14, S4B-01..S4B-12,
# S4C-01..S4C-09, S5-01..S5-26, S5A-01..S5A-12 and S5B-01..S5B-12 — 176 tests: the 162 accepted
# Stage-5A tests retained plus 14 new) on the Stage-5B branch, regenerates the Stage-5B metrics
# from real executions, and uploads the evidence.
#
# Stage 5 MODELS bounded adversarial behaviours and MEASURES outcomes.  It establishes no
# incentive-compatibility, fairness, Sybil-resistance, selfish-mining-resistance,
# coalition-resistance, common-prefix, chain-quality or PoW-equivalent security property.  The
# energy-saving mechanism remains the idle policy within PoCol.

on:
  push:
    branches:
      - "thesis-v45-pocol-stage5b-reward-owner-pathb-wake-coverage-lock"
  pull_request:
    paths:
      - "Models/PoCol/stage2/**"
      - "tests/thesis_revision_v45/stage2/**"
      - ".github/workflows/stage5b-pocol-tests.yml"
  workflow_dispatch: {}

# a new push supersedes an in-flight run for the same ref, so a superseded run never keeps a
# runner busy after its commit has been replaced.
concurrency:
  group: stage5b-pocol-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage5b-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run complete Stage-2B .. Stage-5B test suite
        run: |
          python -m pytest tests/thesis_revision_v45/stage2/ -v --durations=0 \
            -p no:cacheprovider \
            --junitxml=stage5b_ci.junit.xml | tee stage5b_ci.log

      - name: Verify the accepted Stage-2B search core is unmodified
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          # The Stage-2B search core is FROZEN at the accepted Stage-4C baseline
          # (4402bd084fc404cac1d8d85a44fb5d642544c448).  Any change to it invalidates every
          # accepted stage, so this fails the build rather than warning.
          EXPECTED = "17367b4c15eaabd664a496412bc3d1685bfcd9cf8749f71aea01aef70b094140"
          digest = hashlib.sha256(
              pathlib.Path("Models/PoCol/stage2/search.py").read_bytes()).hexdigest()
          print("search.py sha256:", digest)
          if digest != EXPECTED:
              sys.exit(f"search.py changed: expected {EXPECTED}, got {digest}")
          print("OK: the accepted Stage-2B search core is byte-identical to the frozen baseline")
          PY

      - name: Verify Stage-5 is disabled by default (baseline preservation)
        run: |
          python - <<'PY'
          from Models.PoCol.stage2 import Stage2Config, run_simulation
          # the DEFAULT policy values are asserted directly — the confirmatory default config is
          # 141 miners over a 10,000 s horizon, far too large to execute as a CI gate.  The
          # executed no-effect check below uses a small bounded scenario; test S5-01 covers the
          # same property inside the suite.
          c = Stage2Config()
          assert c.adversarial.enabled is False, "adversarial model must default to disabled"
          assert c.incentive.enabled is False, "incentive model must default to disabled"
          assert c.adversarial.entities == () and c.adversarial.miner_behaviours == ()
          assert c.adversarial.free_rider_work_fraction == 1.0
          assert c.adversarial.solution_release_policy == "PROMPT_RELEASE"
          for r in ("r_work", "r_avail", "r_win", "r_reserve", "r_reassign",
                    "q_abandon", "q_false", "q_invalid"):
              assert getattr(c.incentive, r) == 0.0, f"{r} must default to zero"
          bounded = Stage2Config(num_miners=4, reserve_fraction=0.0, nonce_domain_size=400,
                                 difficulty=1 << 300, batch_size=25, horizon_T=60.0)
          run = run_simulation(bounded, run_id="ci-default")
          assert not run.behaviour_profiles and not run.incentive_ledger
          assert not run.withheld_solutions and not run.invalid_actions
          assert not run.progress_claims and not run.adversarial_entities
          assert not run.subassignments and not run.virtual_identities
          assert not run.round_incentive_result and not run.delayed_wake_actions
          print("OK: Stage-5 disabled by default; no Stage-5 effect in a disabled run")
          PY

      - name: Regenerate Stage-5B metrics from real executions
        run: python docs/thesis_revision_v45/stage_05b/generate_stage5b_metrics.py

      - name: Check Stage-5B measured invariants
        run: |
          python - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path(
              "docs/thesis_revision_v45/stage_05b/"
              "STAGE_05B_METRICS.json").read_text())
          inv = d["invariants"]
          # ---- retained Stage-5A acceptance invariants ----
          assert inv["physical_frontier_never_rewinds"], inv
          assert inv["work_reward_union_residual_max"] == 0.0, inv
          assert inv["subassignment_capacity_residual_max"] == 0.0, inv
          assert inv["no_abandonment_penalty_without_action"], inv
          assert inv["incentive_reconciliation_residual_max"] == 0.0, inv
          assert inv["residency_reconciles_in_every_scenario"], inv
          assert inv["disabled_baseline_has_zero_stage5_effect"], inv
          # ---- Stage-5B acceptance invariants ----
          assert inv["S5B_1_every_rewarded_position_has_an_owner"], inv
          assert inv["S5B_1_duplicate_prevented_matches_reconciliation"], inv
          assert inv["S5B_2_second_finalisation_changes_nothing"], inv
          assert inv["S5B_3_true_path_b_scenario_count"] >= 1, inv
          assert sorted(inv["S5B_4_wake_lifecycles_covered"]) == [
              "PATH_A_REASSIGNMENT_WAKE", "PATH_B_REASSIGNMENT_RESERVE_WAKE",
              "PRIMARY_WAKE", "RESERVE_ACTIVATION_WAKE"], inv
          assert inv["S5B_4_no_unattributed_or_unspecified_wake"], inv
          assert inv["S5B_4_another_reserve_activated_total"] > 0, inv
          assert inv["S5B_5_zero_budget_scenario_has_no_action_effect"], inv
          assert inv["S5B_5_actions_rejected_over_limit_total"] > 0, inv
          assert inv["S5B_6_entity_physical_capacity_residual_max"] == 0.0, inv
          assert inv["S5B_6_unmapped_evaluation_total"] == 0, inv
          assert inv["S5B_6_identities_grant_no_physical_capacity"], inv
          assert inv["S5B_7_no_gapped_round_closes_as_exhaustion"], inv
          assert inv["S5B_7_abandonment_never_reports_a_zero_gap"], inv
          assert inv["S5B_8_physical_count_matches_ledger_in_every_scenario"], inv
          assert inv["S5B_8_no_zero_physical_count_beside_a_non_empty_ledger"], inv
          # the replay-purity probe must reproduce the directive's exact ownership figures.
          rp = d["replay_purity_S5B_2"]
          assert rp["work_reward_by_miner_first_call"] == {"M000": 80.0, "M001": 20.0}, rp
          assert rp["work_reward_by_miner_second_call"] == rp["work_reward_by_miner_first_call"]
          assert rp["duplicate_work_reward_prevented_count"] == 40, rp
          assert rp["unique_rewarded_nonce_count"] == 100, rp
          assert rp["work_reward_union_residual"] == 0.0, rp
          print("OK: all Stage-5B measured invariants hold")
          PY

      - name: Run standalone demo (smoke)
        run: python -m Models.PoCol.stage2.demo

      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5b-pytest-evidence
          path: |
            stage5b_ci.log
            stage5b_ci.junit.xml
            docs/thesis_revision_v45/stage_05b/STAGE_05B_METRICS.json
